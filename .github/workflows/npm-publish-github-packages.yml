# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
#
# Run it by hand (Actions -> Node.js Package -> Run workflow) for the tests
# alone, on Linux. Only a release publishes.

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # There are no dependencies, so no `npm ci`: it refuses to run without a
      # lockfile. The suite needs `exposurie` on PATH, because scaffold will not
      # write a pointer to a command that is not there. It goes in a folder of
      # its own, not through `npm link`: on Linux that puts it beside node, and
      # the tests that model a machine with no install keep node's folder on
      # PATH, so they would find it.
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s/bin/exposurie.js" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/exposurie"
          chmod +x "$RUNNER_TEMP/bin/exposurie"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm test

  publish-gpr:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      # GitHub Packages takes only a package scoped to the repository's owner,
      # so the copy published here is @sekhonlabs/exposurie. On npm it stays
      # @sekhon/exposurie; nothing here touches npm.
      - run: npm pkg set name=@sekhonlabs/exposurie
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
